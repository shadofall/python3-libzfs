name: Sync from Upstream

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream zfs-2.4
        id: sync
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/45Drives/python3-libzfs.git
          git fetch upstream zfs-2.4

          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/zfs-2.4)

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "Already up to date."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git merge --ff-only upstream/zfs-2.4
            git push origin main
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  trigger-build:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    uses: ./.github/workflows/build-rpm.yml
    permissions:
      contents: write
